# Seeed XIAO ESP32-S3 hardware config: status LED and Wi-Fi/system diagnostics.
# No RF switch on this board — it supports an external antenna only, no antenna switching
# needed.
# Device identity, credentials, and OTA (esphome name/friendly_name, esp32 variant, api key,
# ota, wifi ssid/password/ap) come from the ESPHome Device Builder-generated device YAML.
# BLE tracking/proxy (esp32_ble_tracker, bluetooth_proxy) is intentionally excluded — see the
# "proxy" variant for that.

esp32:
    # Explicit board ID (not just variant) for correct board-specific defaults.
    board: seeed_xiao_esp32s3
    framework:
        type: esp-idf

esphome:
    includes:
        - <esp_wifi.h>

logger:
    hardware_uart: USB_SERIAL_JTAG

api:
    reboot_timeout: 15min

wifi:
    domain: .local
    power_save_mode: NONE
    fast_connect: true
    enable_on_boot: true
    reboot_timeout: 10min
    enable_btm: true  # 802.11v BSS Transition Management (AP-coordinated roaming)
    enable_rrm: true  # 802.11k Radio Resource Management (neighbor-assisted scanning)
    ap:
        ap_timeout: 120s
    on_connect:
        then:
            - component.update: wifi_channel_sensor
    on_disconnect:
        then:
            - lambda: |-
                id(_wifi_disconnects_since_boot)++;

mdns:

# Status LED on Seeed XIAO ESP32-S3 (GPIO21, user LED - active LOW)
status_led:
    pin:
        number: GPIO21

sensor:
    - platform: internal_temperature
      name: "Internal Temp"
      entity_category: diagnostic

    - platform: uptime
      name: "Uptime"
      unit_of_measurement: "h"
      accuracy_decimals: 2
      update_interval: 60s
      filters:
          - lambda: return x / 3600.0;
      entity_category: diagnostic

    - platform: wifi_signal
      id: wifi_signal_dbm
      name: "Wi-Fi RSSI"
      update_interval: 30s
      entity_category: diagnostic

    - platform: template
      name: "Wi-Fi Disconnects (since boot)"
      id: wifi_disconnects_since_boot_sensor
      entity_category: diagnostic
      accuracy_decimals: 0
      update_interval: 30s
      lambda: |-
          return id(_wifi_disconnects_since_boot);

    - platform: template
      name: "Wi-Fi Channel"
      id: wifi_channel_sensor
      entity_category: diagnostic
      accuracy_decimals: 0
      update_interval: 60s
      lambda: |-
          wifi_ap_record_t ap_info;
          if (esp_wifi_sta_get_ap_info(&ap_info) == ESP_OK) {
            return (float) ap_info.primary;
          }
          return NAN;

text_sensor:
    - platform: wifi_info
      ip_address:
          name: "IP"
          entity_category: diagnostic
      mac_address:
          name: "MAC"
          entity_category: diagnostic
      ssid:
          name: "SSID"
          entity_category: diagnostic
      bssid:
          name: "BSSID"
          entity_category: diagnostic

button:
    - platform: restart
      name: "Restart Device"

globals:
    - id: _wifi_disconnects_since_boot
      type: int
      restore_value: no
      initial_value: '0'

time:
    - platform: sntp
      id: sntp_time
      servers:
          - 0.pool.ntp.org
          - 1.pool.ntp.org
