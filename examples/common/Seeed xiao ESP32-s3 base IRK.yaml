# Seeed XIAO ESP32-S3 hardware add-on: status LED only (no RF switch on this board).
# Everything else (Wi-Fi, API, OTA, BLE/IRK capture, Wi-Fi diagnostics) comes from the ESPHome
# Device Builder-generated device YAML and the irk-capture package.

esp32:
  # Explicit board ID (not just variant) for correct board-specific defaults.
  board: seeed_xiao_esp32s3

logger:
  hardware_uart: USB_SERIAL_JTAG

# Status LED on Seeed XIAO ESP32-S3 (GPIO21, user LED - active LOW)
status_led:
  pin:
    number: GPIO21
